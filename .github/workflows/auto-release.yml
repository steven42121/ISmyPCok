name: Auto Release

on:
  push:
    branches:
      - main
    paths:
      - 'VERSION'
  pull_request:
    paths:
      - 'VERSION'
      - 'apps/**'
      - 'CMakeLists.txt'
      - 'src/**'
      - 'include/**'
      - 'samples/**'
      - 'plugins/**'
      - 'tests/**'
      - 'docs/**'
      - 'plugins/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          Write-Output "version=$v" >> $env:GITHUB_OUTPUT

      - name: Check whether release already exists
        id: check
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.version.outputs.version }}"
          $found = gh release view $tag --json tagName 2>$null
          if ($LASTEXITCODE -eq 0 -and $null -ne $found) {
            Write-Output "exists=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Output "exists=false" >> $env:GITHUB_OUTPUT
          }
          exit 0

      - name: Prepare third-party dependencies
        shell: pwsh
        run: ./scripts/fetch_3rd_party.ps1

      - name: Configure core (Release x64)
        shell: pwsh
        run: cmake -S . -B build -A x64

      - name: Build core (CLI / CAPI / plugins / pc_benchmark)
        shell: pwsh
        run: |
          $targets = @(
            "ispcok_cli",
            "ispcok_capi",
            "ispcok_plugin_sample_gpu",
            "ispcok_plugin_gpu_dx12",
            "ispcok_plugin_npu",
            "pc_benchmark"
          )
          foreach ($target in $targets) {
            cmake --build build --config Release --target $target
            if ($LASTEXITCODE -ne 0) { throw "Build failed for target $target with exit code $LASTEXITCODE" }
          }

          $pluginDir = "build\plugins\Release"
          foreach ($plugin in @("ispcok_plugin_gpu_dx12.dll", "ispcok_plugin_npu.dll")) {
            $source = Join-Path $pluginDir $plugin
            if (-not (Test-Path $source)) { throw "Plugin output not found: $source" }
            Copy-Item $source build\Release\ -Force
          }

      - name: Validate Windows accelerator plugins
        shell: pwsh
        run: |
          $env:ISPCOK_DX12_ALLOW_WARP = "1"
          $dx12 = & build\Release\ispcok_cli.exe run --modules gpu_dx12 --plugin-dir build\Release | ConvertFrom-Json
          $dx12Module = $dx12.modules | Where-Object id -eq "gpu_dx12"
          if ($dx12Module.status -ne "ok" -or $dx12Module.score -le 0) { throw "DX12 WARP validation failed: $($dx12 | ConvertTo-Json -Depth 8)" }
          if ($dx12Module.metrics.fp32_gflops -le 0 -or $dx12Module.metrics.checksum -eq 0) { throw "DX12 WARP metrics are invalid" }

          $npu = & build\Release\ispcok_cli.exe run --modules npu --plugin-dir build\Release | ConvertFrom-Json
          $npuModule = $npu.modules | Where-Object id -eq "npu"
          if (-not $npuModule.plugin) { throw "NPU plugin was not loaded" }
          if ($npuModule.status -notin @("ok", "not_supported")) { throw "NPU plugin returned unexpected status: $($npuModule.status)" }
          if ($npuModule.status -eq "ok" -and ($npuModule.score -le 0 -or $npuModule.metrics.fp16_gflops -le 0 -or $npuModule.metrics.checksum -eq 0)) { throw "NPU FP16 metrics are invalid" }
          if ($npuModule.status -eq "not_supported" -and [string]::IsNullOrWhiteSpace($npuModule.message)) { throw "NPU degradation message is empty" }

      - name: Copy VC runtime DLLs into release outputs
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -property installationPath | Select-Object -First 1
          if (-not $vsPath) { throw "Visual Studio install path not found" }
          $redistRoot = Join-Path $vsPath "VC\Redist\MSVC"
          if (-not (Test-Path $redistRoot)) { throw "VC redistributable folder not found: $redistRoot" }
          $dlls = @("msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll")
          foreach ($dll in $dlls) {
            $found = Get-ChildItem -Path $redistRoot -Filter $dll -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.DirectoryName -match '\\x64\\' } |
              Select-Object -First 1
            if (-not $found) { throw "Missing VC runtime: $dll under $redistRoot" }
            Copy-Item $found.FullName build\Release\ -Force
            Write-Output "Copied $($found.FullName)"
          }
          Write-Output "Copied VC runtime DLLs to build\Release"

      - name: Run core unit tests
        shell: pwsh
        run: |
          cmake --build build --config Release --target ispcok_tests
          ctest --test-dir build -C Release --output-on-failure

      - name: Install UWP C++ v143 build tools
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -property installationPath | Select-Object -First 1
          if (-not $vsPath) { throw "Visual Studio install path not found" }
          $setup = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $argList = "modify --installPath `"$vsPath`" --add Microsoft.VisualStudio.ComponentGroup.UWP.VC --quiet --norestart"
          $p = Start-Process -FilePath $setup -ArgumentList $argList -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "VS setup.exe modify failed with exit code $($p.ExitCode)" }

      - name: Build WinUI app (Release x64)
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          if (-not $msbuild) { throw "MSBuild not found" }
          & $msbuild apps\ISmyPCok.WinUI\ISmyPCok.WinUI.vcxproj /p:Configuration=Release /p:Platform=x64 /restore
          if ($LASTEXITCODE -ne 0) { throw "MSBuild failed with exit code $LASTEXITCODE" }
          $executables = @(Get-ChildItem apps\ISmyPCok.WinUI\x64\Release -Filter ISmyPCokWinUI.exe -Recurse)
          if ($executables.Count -ne 1) { throw "Expected exactly one WinUI executable, found $($executables.Count)" }
          $exe = $executables[0]
          Copy-Item build\Release\ispcok_capi.dll $exe.Directory.FullName -Force
          Write-Output "WINUI_APP_DIR=$($exe.Directory.FullName)" >> $env:GITHUB_ENV

      - name: Check Authenticode signing configuration
        id: signing
        shell: pwsh
        env:
          SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $enabled = (-not [string]::IsNullOrWhiteSpace($env:SIGNING_CERTIFICATE_BASE64)) -and
            (-not [string]::IsNullOrWhiteSpace($env:SIGNING_CERTIFICATE_PASSWORD))
          Write-Output "enabled=$($enabled.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Authenticode sign Windows binaries
        if: github.event_name == 'push' && steps.check.outputs.exists != 'true' && steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "ispcok-signing.pfx"
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:SIGNING_CERTIFICATE_BASE64))

          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signTool) { throw "signtool.exe not found" }

          $files = @(
            "build\Release\ispcok_cli.exe",
            "build\Release\pc_benchmark.exe",
            "build\Release\ispcok_capi.dll",
            "build\Release\ispcok_plugin_gpu_vulkan_sample.dll",
            "build\Release\ispcok_plugin_gpu_dx12.dll",
            "build\Release\ispcok_plugin_npu.dll",
            (Join-Path $env:WINUI_APP_DIR "ISmyPCokWinUI.exe"),
            (Join-Path $env:WINUI_APP_DIR "ispcok_capi.dll")
          )
          $files += Get-ChildItem "build\Release" -Filter "ispcok_plugin_*.dll" | Select-Object -ExpandProperty FullName
          $files = $files | Where-Object { Test-Path $_ } | Sort-Object -Unique

          foreach ($file in $files) {
            & $signTool.FullName sign /fd SHA256 /td SHA256 /tr "http://timestamp.digicert.com" /f $certificatePath /p $env:SIGNING_CERTIFICATE_PASSWORD $file
            if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed for $file" }
            & $signTool.FullName verify /pa /v $file
            if ($LASTEXITCODE -ne 0) { throw "Authenticode verification failed for $file" }
          }

      - name: Dump WinUI generated files (diagnostics)
        if: always()
        shell: pwsh
        run: |
          $proj = "apps\ISmyPCok.WinUI"
          Write-Output "=== Generated Files tree ==="
          Get-ChildItem -Recurse "$proj\Generated Files" -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
          Write-Output "=== OutDir tree (winmd/exe/dll) ==="
          Get-ChildItem -Recurse "$proj\x64\Release" -ErrorAction SilentlyContinue | Where-Object { $_.Extension -in '.winmd','.exe','.dll' } | ForEach-Object { $_.FullName }
          Write-Output "=== Generated .g.h contents ==="
          Get-ChildItem -Recurse "$proj\Generated Files" -Filter *.g.h -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Output "----- $($_.FullName) -----"
            Get-Content $_.FullName
          }
          Write-Output "=== Generated .xaml.g.hpp contents ==="
          Get-ChildItem -Recurse "$proj\Generated Files" -Filter *.xaml.g.hpp -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Output "----- $($_.FullName) -----"
            Get-Content $_.FullName
          }
          Write-Output "=== Generated .g.cpp contents ==="
          Get-ChildItem -Recurse "$proj\Generated Files" -Filter *.g.cpp -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Output "----- $($_.FullName) -----"
            Get-Content $_.FullName
          }
          Write-Output "=== XamlCompiler input.json (Generated Files) ==="
          Get-Content "$proj\Generated Files\input.json" -ErrorAction SilentlyContinue
          Write-Output "=== XamlCompiler output.json (Generated Files) ==="
          Get-Content "$proj\Generated Files\output.json" -ErrorAction SilentlyContinue
          Write-Output "=== XamlCompiler input.json (IntDir) ==="
          Get-Content "$proj\ISmyPCok.WinUI\x64\Release\input.json" -ErrorAction SilentlyContinue
          Write-Output "=== XamlCompiler output.json (IntDir) ==="
          Get-Content "$proj\ISmyPCok.WinUI\x64\Release\output.json" -ErrorAction SilentlyContinue
          Write-Output "=== winrt/ISmyPCokWinUI.h ==="
          Get-Content "$proj\Generated Files\winrt\ISmyPCokWinUI.h" -ErrorAction SilentlyContinue
          Write-Output "=== sources/MainWindow.h ==="
          Get-Content "$proj\Generated Files\sources\MainWindow.h" -ErrorAction SilentlyContinue
          Write-Output "=== cppwinrt_comp.rsp ==="
          Get-Content "$proj\ISmyPCok.WinUI\x64\Release\ISmyPCok.WinUI.vcxproj.cppwinrt_comp.rsp" -ErrorAction SilentlyContinue
          Write-Output "=== cppwinrt_ref.rsp ==="
          Get-Content "$proj\ISmyPCok.WinUI\x64\Release\ISmyPCok.WinUI.vcxproj.cppwinrt_ref.rsp" -ErrorAction SilentlyContinue
          Write-Output "=== mdmerge.rsp ==="
          Get-Content "$proj\ISmyPCok.WinUI\x64\Release\ISmyPCok.WinUI.vcxproj.mdmerge.rsp" -ErrorAction SilentlyContinue

      - name: Package CLI artifact
        if: github.event_name == 'pull_request' || steps.check.outputs.exists != 'true'
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.version }}"
          $zipName = "ISmyPCok-$tag-windows-x64-cli.zip"
          Compress-Archive -Path @(
            "build/Release/ispcok_cli.exe",
            "build/Release/ispcok_capi.dll",
            "build/Release/ispcok_plugin_gpu_vulkan_sample.dll",
            "build/Release/ispcok_plugin_gpu_dx12.dll",
            "build/Release/ispcok_plugin_npu.dll",
            "build/Release/pc_benchmark.exe",
            "build/Release/msvcp140.dll",
            "build/Release/vcruntime140.dll",
            "build/Release/vcruntime140_1.dll",
            "README.md",
            "LICENSE"
          ) -DestinationPath $zipName -Force
          Write-Output "PACKAGE_CLI=$zipName" >> $env:GITHUB_ENV

      - name: Smoke test packaged CLI (list + benchmark run)
        if: github.event_name == 'pull_request' || steps.check.outputs.exists != 'true'
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.version }}"
          $staging = "staging-cli"
          if (Test-Path $staging) { Remove-Item -Recurse -Force $staging }
          New-Item -ItemType Directory -Path $staging | Out-Null
          Expand-Archive -Path "ISmyPCok-$tag-windows-x64-cli.zip" -DestinationPath $staging -Force

          Write-Output "=== verify VC runtime DLLs are bundled ==="
          foreach ($dll in @("msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll")) {
            if (-not (Test-Path "$staging\$dll")) { throw "Missing bundled runtime DLL: $dll" }
          }
          foreach ($plugin in @("ispcok_plugin_gpu_dx12.dll", "ispcok_plugin_npu.dll")) {
            if (-not (Test-Path "$staging\$plugin")) { throw "Missing packaged accelerator plugin: $plugin" }
          }

          Write-Output "=== ispcok_cli list-modules ==="
          & "$staging\ispcok_cli.exe" list-modules
          if ($LASTEXITCODE -ne 0) { throw "list-modules failed with exit code $LASTEXITCODE" }

          Write-Output "=== ispcok_cli run (game_engine, restricted modules) ==="
          $json = & "$staging\ispcok_cli.exe" run --modules cpu_fp32,memory_bw,net_rtt --scenario game_engine
          $rc = $LASTEXITCODE
          if ($rc -ne 0) { throw "CLI benchmark run failed with exit code $rc" }
          $json | Out-Host
          if ($json -notmatch '"score"') { throw "CLI benchmark output missing score" }

          Write-Output "=== pc_benchmark list ==="
          & "$staging\pc_benchmark.exe" -l
          if ($LASTEXITCODE -ne 0) { throw "pc_benchmark list failed with exit code $LASTEXITCODE" }

          Write-Output "=== pc_benchmark run (filtered, quick) ==="
          & "$staging\pc_benchmark.exe" -f "cpu.integer_hash" -q -o json
          if ($LASTEXITCODE -ne 0) { throw "pc_benchmark run failed with exit code $LASTEXITCODE" }

          Write-Output "SMOKE TEST OK"

      - name: Package WinUI artifact
        if: github.event_name == 'pull_request' || steps.check.outputs.exists != 'true'
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.version }}"
          $zipName = "ISmyPCok-$tag-windows-x64-winui.zip"
          $appDir = $env:WINUI_APP_DIR
          if (-not $appDir -or -not (Test-Path (Join-Path $appDir "ISmyPCokWinUI.exe"))) {
            throw "WinUI application directory is invalid: $appDir"
          }
          $runtimeFiles = @("msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll")
          foreach ($dll in $runtimeFiles) {
            Copy-Item build\Release\$dll $appDir -Force
          }
          foreach ($plugin in @("ispcok_plugin_gpu_dx12.dll", "ispcok_plugin_npu.dll")) {
            Copy-Item build\Release\$plugin $appDir -Force
          }
          $requiredFiles = @(
            "ISmyPCokWinUI.exe",
            "ispcok_capi.dll",
            "resources.pri",
            "App.xbf",
            "MainWindow.xbf",
            "Microsoft.ui.xaml.dll",
            "Microsoft.UI.Xaml.Controls.dll",
            "Microsoft.UI.Xaml.Controls.pri",
            "Microsoft.WindowsAppRuntime.dll",
            "Microsoft.WindowsAppRuntime.Bootstrap.dll",
            "msvcp140.dll",
            "vcruntime140.dll",
            "vcruntime140_1.dll",
            "ispcok_plugin_gpu_dx12.dll",
            "ispcok_plugin_npu.dll"
          )
          foreach ($file in $requiredFiles) {
            if (-not (Test-Path (Join-Path $appDir $file))) {
              throw "Missing WinUI deployment file: $file in $appDir"
            }
          }
          Compress-Archive -Path (Get-ChildItem $appDir | Select-Object -ExpandProperty FullName) -DestinationPath $zipName -Force
          Write-Output "PACKAGE_WINUI=$zipName" >> $env:GITHUB_ENV

      - name: Smoke test packaged WinUI (startup + window activation)
        if: github.event_name == 'pull_request' || steps.check.outputs.exists != 'true'
        continue-on-error: true
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.version }}"
          $staging = Join-Path $env:RUNNER_TEMP "ispcok-winui-smoke-$tag-$([guid]::NewGuid().ToString('N'))"
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          Expand-Archive -Path "ISmyPCok-$tag-windows-x64-winui.zip" -DestinationPath $staging -Force

          $exe = Join-Path $staging "ISmyPCokWinUI.exe"
          if (-not (Test-Path $exe)) { throw "Packaged WinUI executable not found at ZIP root" }

          $startupLog = Join-Path $staging "ISmyPCokWinUI-startup.log"
          $process = Start-Process -FilePath $exe -WorkingDirectory $staging -PassThru

          try {
            $deadline = (Get-Date).AddSeconds(30)
            do {
              Start-Sleep -Milliseconds 250
              $process.Refresh()
              if ($process.HasExited) {
                $details = if (Test-Path $startupLog) { Get-Content $startupLog -Raw } else { "no startup log" }
                throw "WinUI exited during startup with code $($process.ExitCode): $details"
              }
            } while (($process.MainWindowHandle -eq 0) -and (Get-Date) -lt $deadline)

            if ($process.MainWindowHandle -eq 0) {
              $details = if (Test-Path $startupLog) { Get-Content $startupLog -Raw } else { "no startup log" }
              throw "WinUI did not create a top-level window within 30 seconds: $details"
            }

            $stableUntil = (Get-Date).AddSeconds(3)
            do {
              Start-Sleep -Milliseconds 250
              $process.Refresh()
              if ($process.HasExited) {
                $details = if (Test-Path $startupLog) { Get-Content $startupLog -Raw } else { "no startup log" }
                throw "WinUI exited during the startup stability window with code $($process.ExitCode): $details"
              }
            } while ((Get-Date) -lt $stableUntil)
            if ($process.MainWindowHandle -eq 0) {
              throw "WinUI top-level window disappeared during the startup stability window"
            }
            Write-Output "WINUI SMOKE TEST OK"
          }
          finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      - name: Create GitHub Release
        if: github.event_name == 'push' && steps.check.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ISmyPCok ${{ steps.version.outputs.version }}
          body: |
            Auto-generated release for version `${{ steps.version.outputs.version }}`.

            - CLI (ispcok_cli) + C ABI (ispcok_capi.dll) + GPU plugin sample
            - WinUI3 desktop app (self-contained)
          files: |
            ISmyPCok-*.zip
